name: Node CI (reusable)

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory holding package.json, relative to repo root
        required: false
        type: string
        default: "."
      node_version:
        required: false
        type: string
        default: "24"
      lint_command:
        description: Lint command; empty skips the step
        required: false
        type: string
        default: ""
      build_command:
        description: Build command; empty skips the step
        required: false
        type: string
        default: "npm run build"
      test_command:
        description: Test command; empty skips the step
        required: false
        type: string
        default: "npm test"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: aneillans/github-templates/actions/setup-node-cache@v1
        with:
          node-version: ${{ inputs.node_version }}
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: inputs.lint_command != ''
        run: ${{ inputs.lint_command }}

      - name: Build
        if: inputs.build_command != ''
        run: ${{ inputs.build_command }}

      - name: Test
        if: inputs.test_command != ''
        run: ${{ inputs.test_command }}
