name: Release Upload Assets (reusable)

# Attaches build artifacts to a draft release from release-cut. Refuses a published release, so a
# rerun can't change files people have already downloaded. Re-cut with force to rebuild one.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the draft release
        required: true
        type: string
      artifact_pattern:
        description: Globs of artifact names from this run to attach, one per line, e.g. appimage-*
        required: true
        type: string
      harden_runner:
        description: Run step-security/harden-runner in audit mode
        required: false
        type: boolean
        default: true

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden runner
        if: inputs.harden_runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      # download-artifact takes one pattern, so fetch everything, one directory per artifact, and filter
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Select artifacts
        env:
          PATTERNS: ${{ inputs.artifact_pattern }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          while IFS= read -r pattern; do
            pattern="$(printf '%s' "$pattern" | tr -d '[:space:]')"
            [ -n "$pattern" ] || continue
            matched=false
            for dir in "$RUNNER_TEMP"/artifacts/*/; do
              name="$(basename "$dir")"
              # unquoted on purpose: the pattern is a glob
              # shellcheck disable=SC2053
              [[ "$name" == $pattern ]] || continue
              matched=true
              echo "Attaching $name"
              find "$dir" -type f -exec cp {} "$RUNNER_TEMP/assets/" \;
            done
            [ "$matched" = true ] || { echo "::error::No artifact matched $pattern"; exit 1; }
          done <<<"$PATTERNS"

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" \
            || { echo "::error::No release for $TAG; run the release cut first"; exit 1; }
          [ "$is_draft" = true ] || { echo "::error::$TAG is already published"; exit 1; }

          mapfile -d '' files < <(find "$RUNNER_TEMP/assets" -type f -print0)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::No artifacts matched"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
