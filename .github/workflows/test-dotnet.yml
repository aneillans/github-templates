name: Test .NET templates

on:
  pull_request:
    paths:
      - ".github/workflows/dotnet-*.yml"
      - ".github/workflows/test-dotnet.yml"
      - "actions/setup-dotnet-cache/**"
      - "tests/dotnet/**"
      - "tests/dotnet-appimage/**"
      - "tests/dotnet-android/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dotnet-*.yml"
      - ".github/workflows/test-dotnet.yml"
      - "actions/setup-dotnet-cache/**"
      - "tests/dotnet/**"
      - "tests/dotnet-appimage/**"
      - "tests/dotnet-android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/dotnet-ci.yml
    with:
      project: tests/dotnet/TemplateTest.slnx

  pack:
    needs: ci
    uses: ./.github/workflows/dotnet-pack.yml
    with:
      project: tests/dotnet/src/TemplateTest/TemplateTest.csproj
      package_version: 0.0.0-ci.${{ github.run_number }}
      artifact_name: test-dotnet-nupkg

  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: linux-x64, runner: ubuntu-24.04 }
          - { runtime: linux-arm64, runner: ubuntu-24.04-arm }
    uses: ./.github/workflows/dotnet-appimage.yml
    with:
      working_directory: tests/dotnet-appimage
      project: TemplateTestApp.csproj
      runtime: ${{ matrix.runtime }}
      runner: ${{ matrix.runner }}
      # same shape as next-version's stamp output
      version: 0.0.1+${{ github.run_number }}
      pack_id: test.templates.app
      main_exe: TemplateTestApp
      tarball: true
      max_size_mb: 60

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: win-x64, runner: windows-2025 }
          - { runtime: win-arm64, runner: windows-11-arm }
    uses: ./.github/workflows/dotnet-windows.yml
    with:
      # same console app as the AppImage test
      working_directory: tests/dotnet-appimage
      project: TemplateTestApp.csproj
      runtime: ${{ matrix.runtime }}
      runner: ${{ matrix.runner }}
      version: 0.0.1+${{ github.run_number }}
      pack_id: test.templates.app
      main_exe: TemplateTestApp
      max_size_mb: 60

  android:
    uses: ./.github/workflows/dotnet-android.yml
    with:
      project: tests/dotnet-android/TemplateTestAndroid.csproj
      version: 0.0.1+${{ github.run_number }}
      version_code: ${{ github.run_number }}
      package_name: TemplateTest
