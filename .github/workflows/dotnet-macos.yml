name: .NET macOS app (reusable)

# Publishes one project for one runtime and packs it with Velopack into an .app bundle, shipped as a
# Setup.pkg and a portable zip, uploaded as the artifact macos-<runtime>. Ad-hoc signed, not
# notarized, so Gatekeeper blocks a downloaded copy until the user clears quarantine. Read-only:
# release-upload-assets attaches the result to a release. The caller's dotnet-tools.json must pin vpk.
# No Harden-Runner: its macOS agent isn't available on the community tier.

on:
  workflow_call:
    inputs:
      project:
        description: csproj to publish, relative to working_directory
        required: true
        type: string
      runtime:
        description: Runtime identifier, osx-x64 or osx-arm64. Also the Velopack channel, so each architecture keeps its own update feed
        required: true
        type: string
      version:
        description: Package version, at least 0.0.1 (vpk's minimum), such as next-version's stamp output; a leading v is stripped
        required: true
        type: string
      pack_id:
        description: Velopack package id, which starts every file name, e.g. MyApp. Changing it after release breaks updates for existing installs
        required: true
        type: string
      main_exe:
        description: File name of the entry executable
        required: true
        type: string
      runner:
        description: Must match the runtime's architecture, e.g. macos-15 for osx-arm64, macos-15-intel for osx-x64
        required: false
        type: string
        default: macos-latest
      bundle_id:
        description: Apple bundle id, e.g. com.example.myapp. Defaults to vpk's, derived from pack_id
        required: false
        type: string
        default: ""
      title:
        required: false
        type: string
        default: ""
      authors:
        required: false
        type: string
        default: ""
      icon:
        description: .icns file, relative to working_directory
        required: false
        type: string
        default: ""
      entitlements:
        description: Hardened-runtime entitlements plist, relative to working_directory; vpk requires a .entitlements extension. Defaults to vpk's, which allow JIT
        required: false
        type: string
        default: ""
      exclude:
        description: Regex of files left out of the package
        required: false
        type: string
        default: '.*\.(pdb|dbg)'
      max_size_mb:
        description: Fail if the published files, minus debug symbols, exceed this size. 0 disables the check
        required: false
        type: number
        default: 0
      dotnet_version:
        required: false
        type: string
        default: "10.0.x"
      global_json_file:
        description: Path to a global.json, relative to the repo root; takes the SDK version from it instead of dotnet_version. Empty uses the repo root's global.json if there is one
        required: false
        type: string
        default: ""
      configuration:
        required: false
        type: string
        default: "Release"
      working_directory:
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ inputs.runtime }}
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PROJECT: ${{ inputs.project }}
      RUNTIME: ${{ inputs.runtime }}
      CONFIGURATION: ${{ inputs.configuration }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: aneillans/github-templates/actions/setup-dotnet-cache@v1
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          global-json-file: ${{ inputs.global_json_file }}

      - name: Check version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version="${VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::Not a semver version: '$VERSION'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "display=${version%%+*}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore "$PROJECT"

      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish "$PROJECT" --configuration "$CONFIGURATION" --runtime "$RUNTIME" --no-restore \
            -p:Version="$VERSION" --output "$RUNNER_TEMP/publish"
          # NativeAOT's debug symbols; a directory, so the file regex in exclude can't drop it
          find "$RUNNER_TEMP/publish" -name '*.dSYM' -prune -exec rm -rf {} +

      - name: Check size
        if: inputs.max_size_mb > 0
        env:
          MAX_SIZE_MB: ${{ inputs.max_size_mb }}
        run: |
          # BSD du has no --exclude or byte count
          size="$(find "$RUNNER_TEMP/publish" -type f ! -name '*.dbg' ! -name '*.pdb' -exec stat -f %z {} + \
            | awk '{ s += $1 } END { print s + 0 }')"
          echo "Shipped size: $((size / 1024 / 1024)) MiB"
          test "$size" -lt "$((MAX_SIZE_MB * 1024 * 1024))"

      - name: Restore tools
        run: dotnet tool restore

      - name: Pack app
        env:
          # vpk targets net10.0; this lets it run where only a newer runtime is installed
          DOTNET_ROLL_FORWARD: Major
          VERSION: ${{ steps.version.outputs.version }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display }}
          PACK_ID: ${{ inputs.pack_id }}
          MAIN_EXE: ${{ inputs.main_exe }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          TITLE: ${{ inputs.title }}
          AUTHORS: ${{ inputs.authors }}
          ICON: ${{ inputs.icon }}
          ENTITLEMENTS: ${{ inputs.entitlements }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          args=()
          [ -n "$BUNDLE_ID" ] && args+=(--bundleId "$BUNDLE_ID")
          [ -n "$TITLE" ] && args+=(--packTitle "$TITLE")
          [ -n "$AUTHORS" ] && args+=(--packAuthors "$AUTHORS")
          [ -n "$ICON" ] && args+=(--icon "$ICON")
          [ -n "$ENTITLEMENTS" ] && args+=(--signEntitlements "$ENTITLEMENTS")
          # Identity "-" is codesign's ad-hoc signature: no certificate, but Apple silicon refuses
          # to run unsigned code, and it seals the bundle Velopack adds its updater to
          dotnet vpk pack \
            --packId "$PACK_ID" \
            --packVersion "$VERSION" \
            --packDir "$RUNNER_TEMP/publish" \
            --mainExe "$MAIN_EXE" \
            --runtime "$RUNTIME" \
            --channel "$RUNTIME" \
            --exclude "$EXCLUDE" \
            --signAppIdentity - \
            --outputDir "$RUNNER_TEMP/release" \
            "${args[@]}"
          # local bookkeeping for vpk; `vpk upload` doesn't publish it either
          rm -f "$RUNNER_TEMP"/release/assets.*.json
          # vpk leaves the version out of these names, and the update feed doesn't reference them
          for kind in Setup.pkg Portable.zip; do
            mv "$RUNNER_TEMP/release/$PACK_ID-$RUNTIME-$kind" "$RUNNER_TEMP/release/$PACK_ID-$DISPLAY_VERSION-$RUNTIME-$kind"
          done
          ls -l "$RUNNER_TEMP/release"

      - name: Verify signature
        env:
          ZIP: ${{ runner.temp }}/release/${{ inputs.pack_id }}-${{ steps.version.outputs.display }}-${{ inputs.runtime }}-Portable.zip
        run: |
          mkdir "$RUNNER_TEMP/verify"
          ditto -x -k "$ZIP" "$RUNNER_TEMP/verify"
          app="$(find "$RUNNER_TEMP/verify" -maxdepth 1 -name '*.app' | head -n 1)"
          [ -n "$app" ] || { echo "::error::No .app bundle in $ZIP"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ inputs.runtime }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
