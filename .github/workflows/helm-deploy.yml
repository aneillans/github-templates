name: Helm Deploy (reusable)

on:
  workflow_call:
    inputs:
      chart:
        description: Chart path relative to repo root
        required: true
        type: string
      release:
        required: true
        type: string
      namespace:
        required: true
        type: string
      ref:
        description: Git ref to check out the chart from; empty uses the triggering commit
        required: false
        type: string
        default: ""
      environment:
        description: GitHub Environment to run under (for approvals + environment-scoped secrets)
        required: false
        type: string
      runs_on:
        description: Runner label; use a self-hosted label when the cluster API isn't public
        required: false
        type: string
        default: "ubuntu-latest"
      values_files:
        description: Values files relative to repo root, one per line, applied in order
        required: false
        type: string
        default: ""
      set_values:
        description: Non-secret overrides, one path=value per line, passed as --set-string
        required: false
        type: string
        default: ""
      secret_values:
        description: |
          Secret overrides, one helm.path=SECRET_NAME per line. Written to a temporary values
          file rather than the command line. Secrets need the caller to pass `secrets: inherit`,
          or the `secrets_json` secret from another owner. Environment secrets don't reach this
          workflow from another owner: use the helm-deploy action in the caller's job instead.
        required: false
        type: string
        default: ""
      var_values:
        description: Overrides from configuration variables, one helm.path=VAR_NAME per line
        required: false
        type: string
        default: ""
      kubeconfig_secret:
        description: Name of the secret holding a base64-encoded kubeconfig
        required: false
        type: string
        default: "KUBE_CONFIG"
      helm_version:
        required: false
        type: string
        default: "v3.16.4"
      timeout:
        required: false
        type: string
        default: "5m"
    secrets:
      secrets_json:
        description: |
          JSON object of the caller's secrets: pass toJSON(secrets) in an expression. Needed when the caller
          is outside this repo's owner, where `secrets: inherit` passes nothing.
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ${{ inputs.runs_on }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: aneillans/github-templates/actions/helm-deploy@v1
        with:
          chart: ${{ inputs.chart }}
          release: ${{ inputs.release }}
          namespace: ${{ inputs.namespace }}
          ref: ${{ inputs.ref }}
          values_files: ${{ inputs.values_files }}
          set_values: ${{ inputs.set_values }}
          secret_values: ${{ inputs.secret_values }}
          var_values: ${{ inputs.var_values }}
          kubeconfig_secret: ${{ inputs.kubeconfig_secret }}
          secrets_json: ${{ toJSON(secrets) }}
          vars_json: ${{ toJSON(vars) }}
          helm_version: ${{ inputs.helm_version }}
          timeout: ${{ inputs.timeout }}
