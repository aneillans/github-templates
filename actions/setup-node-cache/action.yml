name: Setup Node with npm cache
description: Installs Node.js, with npm dependency caching unless disabled

inputs:
  node-version:
    required: false
    default: "24"
  cache:
    description: Package manager to cache (npm, yarn, pnpm); empty disables caching, e.g. when there is no lockfile
    required: false
    default: "npm"
  cache-dependency-path:
    description: Lockfile path(s) for the cache key; needed when package-lock.json isn't at the repo root
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
