name: Setup .NET with NuGet cache
description: Installs the .NET SDK and caches ~/.nuget/packages keyed on lock files, falling back to project files

inputs:
  dotnet-version:
    required: false
    default: "10.0.x"
  global-json-file:
    description: Path to a global.json; takes the SDK version from it instead of dotnet-version
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.global-json-file == '' && inputs.dotnet-version || '' }}
        global-json-file: ${{ inputs.global-json-file }}

    - uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        # repos without packages.lock.json still need a key that changes when dependencies do
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', '**/nuget.config', '**/NuGet.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
