name: Resolve deploy commit
description: |
  Picks the commit to deploy and proves it was built: every image must exist tagged with the full
  commit SHA, which docker-build-push adds by default. Optionally restricts the commit to one
  branch's history or a published release, and reads the version baked into the image.

inputs:
  images:
    description: Image references without a tag, one per line. The first is used for the version and default-commit search.
    required: true
  run_sha:
    description: Commit from a triggering workflow_run (github.event.workflow_run.head_sha); wins over sha
    required: false
    default: ""
  ref:
    description: Branch, tag or SHA requested by hand; a version tag works with or without tag_prefix. Empty picks the newest built commit on search_branch.
    required: false
    default: ""
  sha:
    description: Deprecated alias for ref
    required: false
    default: ""
  require_branch:
    description: Fail unless the commit is in this branch's history, e.g. main for production. Empty allows any commit.
    required: false
    default: ""
  require_published:
    description: A tag ref must have a published GitHub Release, which also satisfies require_branch. Drafts are refused.
    required: false
    default: "false"
  allow_missing:
    description: When a branch or tag has no images, set built to false instead of failing, so the caller can build it
    required: false
    default: "false"
  search_branch:
    description: Branch searched for the newest built commit when no SHA is given
    required: false
    default: "main"
  search_depth:
    description: How many first-parent commits of search_branch to try
    required: false
    default: "20"
  version_env:
    description: Environment variable in the image config holding the build version; empty skips the version
    required: false
    default: ""
  registry:
    description: Registry to log in to; empty skips login (public images)
    required: false
    default: ""
  registry_username:
    required: false
    default: ""
  registry_password:
    required: false
    default: ""
  tag_prefix:
    required: false
    default: "v"
  github_token:
    required: false
    default: ${{ github.token }}

outputs:
  ref:
    description: The branch or tag that ref resolved to, e.g. v1.5.0 for 1.5.0; empty for a SHA or no ref
    value: ${{ steps.resolve.outputs.ref }}
  sha:
    description: Full commit SHA to deploy
    value: ${{ steps.resolve.outputs.sha }}
  version:
    description: Value of version_env in the first image, or empty
    value: ${{ steps.resolve.outputs.version }}
  built:
    description: Whether every image exists; only false with allow_missing
    value: ${{ steps.resolve.outputs.built }}

runs:
  using: composite
  steps:
    # full history for rev-parse, rev-list and the branch check
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        path: .resolve-deploy

    - if: inputs.registry != ''
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry_username }}
        password: ${{ inputs.registry_password }}

    - id: resolve
      shell: bash
      working-directory: .resolve-deploy
      env:
        IMAGES: ${{ inputs.images }}
        GH_TOKEN: ${{ inputs.github_token }}
        RUN_SHA: ${{ inputs.run_sha }}
        INPUT_REF: ${{ inputs.ref || inputs.sha }}
        REQUIRE_BRANCH: ${{ inputs.require_branch }}
        REQUIRE_PUBLISHED: ${{ inputs.require_published }}
        ALLOW_MISSING: ${{ inputs.allow_missing }}
        TAG_PREFIX: ${{ inputs.tag_prefix }}
        SEARCH_BRANCH: ${{ inputs.search_branch }}
        SEARCH_DEPTH: ${{ inputs.search_depth }}
        VERSION_ENV: ${{ inputs.version_env }}
      run: |
        mapfile -t images < <(printf '%s\n' "$IMAGES" | tr -d '[:blank:]' | sed '/^$/d')
        [ "${#images[@]}" -gt 0 ] || { echo "::error::No images given"; exit 1; }
        built() { docker buildx imagetools inspect "${images[0]}:$1" >/dev/null 2>&1; }

        named=false
        is_tag=false
        ref=""
        if [ -n "$RUN_SHA" ]; then
          sha="$RUN_SHA"
        elif [ -n "$INPUT_REF" ]; then
          sha=""
          if [[ "$INPUT_REF" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            sha="$(git rev-parse --verify --quiet "${INPUT_REF}^{commit}" || true)"
          fi
          if [ -z "$sha" ]; then
            named=true
            ref="$INPUT_REF"
            if sha="$(git rev-parse --verify --quiet "refs/tags/${INPUT_REF}^{commit}")"; then
              is_tag=true
            elif sha="$(git rev-parse --verify --quiet "refs/tags/${TAG_PREFIX}${INPUT_REF}^{commit}")"; then
              is_tag=true
              ref="$TAG_PREFIX$INPUT_REF"
            else
              sha="$(git rev-parse --verify --quiet "origin/${INPUT_REF}^{commit}")" \
                || { echo "::error::Unknown branch, tag or commit: $INPUT_REF"; exit 1; }
            fi
          fi
        else
          sha=""
          for candidate in $(git rev-list --first-parent -n "$SEARCH_DEPTH" "origin/$SEARCH_BRANCH"); do
            if built "$candidate"; then sha="$candidate"; break; fi
          done
          [ -n "$sha" ] || { echo "::error::No built commit in the last $SEARCH_DEPTH on $SEARCH_BRANCH"; exit 1; }
        fi

        published=false
        if [ "$REQUIRE_PUBLISHED" = true ] && [ "$is_tag" = true ]; then
          # this endpoint only returns published releases
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ref" >/dev/null 2>&1 \
            || { echo "::error::$ref has no published release; publish it first"; exit 1; }
          published=true
        fi

        if [ -n "$REQUIRE_BRANCH" ] && [ "$published" = false ] \
          && ! git merge-base --is-ancestor "$sha" "origin/$REQUIRE_BRANCH"; then
          echo "::error::$sha is not on $REQUIRE_BRANCH"
          exit 1
        fi

        built_all=true
        for image in "${images[@]}"; do
          if ! docker buildx imagetools inspect "$image:$sha" >/dev/null; then
            if [ "$ALLOW_MISSING" = true ] && [ "$named" = true ]; then
              built_all=false
              break
            fi
            echo "::error::Missing image $image:$sha; run Build on a branch or tag holding it"
            exit 1
          fi
        done

        if [ "$built_all" = false ]; then
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "built=false" >> "$GITHUB_OUTPUT"
          echo "$sha has no images; the caller builds $ref"
          echo "Deploying ${ref:+$ref at }$sha, building it first" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        version=""
        if [ -n "$VERSION_ENV" ]; then
          # .Image is one config for a single-platform image, or a map of platform -> config
          version="$(docker buildx imagetools inspect "${images[0]}:$sha" --format '{{json .Image}}' \
            | jq -r --arg k "$VERSION_ENV=" '
                (if has("config") then .config else (to_entries[0].value.config) end).Env // []
                | map(select(startswith($k)) | ltrimstr($k)) | first // empty')"
          [ -n "$version" ] || echo "::warning::$VERSION_ENV not set in ${images[0]}:$sha"
        fi

        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "built=true" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Deploying $sha${version:+ ($version)}"
        echo "Deploying ${ref:+$ref at }$sha${version:+, version $version}" >> "$GITHUB_STEP_SUMMARY"

    - if: always()
      shell: bash
      run: rm -rf .resolve-deploy
